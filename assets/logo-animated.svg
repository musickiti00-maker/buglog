<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="1360" height="520">
<style>
.hex{stroke-dasharray:540;animation:draw 1s ease-out both}
.hexfill{animation:fade .6s .2s both}
.grow{animation:grow 1.8s ease-out both}
@keyframes grow{0%,20%{transform:scale(.35) rotate(-20deg);opacity:0}25%{opacity:1}100%{transform:none}}
.bob{animation:bob 2.2s 1.8s ease-in-out infinite}
.elL{transform-origin:-4px -8px;animation:flL .16s ease-in-out infinite alternate}
.elR{transform-origin:4px -8px;animation:flR .16s ease-in-out infinite alternate}
@keyframes flL{to{transform:rotate(12deg)}}
@keyframes flR{to{transform:rotate(-12deg)}}
.trail{stroke-dasharray:1;animation:trail 1.8s ease-out both}
@keyframes trail{0%,20%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
.speed{animation:tw .5s ease-in-out infinite}
.hwL{transform-origin:-6px 0;animation:hwL .1s ease-in-out infinite alternate}
.hwR{transform-origin:6px 0;animation:hwR .1s ease-in-out infinite alternate}
@keyframes hwL{to{transform:rotate(18deg)}}
@keyframes hwR{to{transform:rotate(-18deg)}}
.reveal{transform-box:fill-box;transform-origin:0 50%;animation:rev .8s 1.1s ease-out both}
.dot{animation:pop .3s both}
.tag{animation:up .6s 2s both}.tag2{animation:up .6s 2.2s both}
.shine{animation:shine 4.5s 2.6s ease-in-out infinite both}
.sp{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite both}
@keyframes draw{from{stroke-dashoffset:540}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes rev{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes shine{0%,70%{transform:translateX(0)}100%{transform:translateX(440px)}}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.55)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
